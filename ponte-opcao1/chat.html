<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Claude · Telegram (demo local)</title>
<style>
:root{--tg:#0e1621;--side:#17212b;--bar:#17212b;--me:#2b5278;--bot:#182533;--txt:#f5f5f5;--mut:#7f91a4;--sky:#5eb5f7;--amb:#FACC15;--ok:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;background:var(--tg);color:var(--txt);height:100vh;display:grid;grid-template-columns:270px 1fr 330px;overflow:hidden}
aside.list{background:var(--side);border-right:1px solid #0b1118}
.search{margin:12px;padding:9px 14px;border-radius:20px;background:#242f3d;color:var(--mut);font-size:14px}
.item{display:flex;gap:12px;padding:10px 12px;align-items:center}
.item.on{background:#2b5278}
.ava{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#1a1206;background:linear-gradient(135deg,#FACC15,#f0a020);flex:none}
.ava.g{background:#4f7cac;color:#fff}
.item b{font-size:15px;display:block}.item small{color:#a9bdd0;font-size:13px}
main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;position:relative}
#leg{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--amb);color:#1a1206;font-weight:800;font-size:16px;padding:7px 16px;border-radius:999px;white-space:nowrap;opacity:0;transition:opacity .2s;z-index:5}
#leg.on{opacity:1}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--bar);border-bottom:1px solid #0b1118}
header .ava{width:40px;height:40px}
header b{font-size:15px}header small{display:block;font-size:13px;color:var(--mut)}
header small.typing{color:var(--sky)}
#chat{flex:1;min-height:0;overflow-y:auto;padding:18px 40px 18px;display:flex;flex-direction:column;gap:8px;background:#0e1621 radial-gradient(circle at 70% 10%,#16243a 0,transparent 55%)}
.m{max-width:62%;padding:8px 12px 6px;border-radius:14px;font-size:15px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.m.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.m .t{display:block;text-align:right;font-size:11px;color:#8aa2b9;margin-top:2px}
form{display:flex;gap:10px;padding:10px 16px;background:var(--bar)}
#txt{flex:1;border:0;outline:0;border-radius:20px;background:#242f3d;color:var(--txt);padding:11px 16px;font-size:15px;font-family:inherit}
#send{width:44px;height:44px;border-radius:50%;border:0;background:var(--sky);color:#0e1621;font-weight:800;font-size:18px;cursor:pointer}
aside.ponte{height:100vh;background:#0c0c10;border-left:1px solid #22222a;padding:16px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;overflow-y:auto}
aside.ponte h2{font-family:Inter,sans-serif;font-size:13px;letter-spacing:.1em;color:#9a9aa6;margin-bottom:4px}
aside.ponte p.sub{font-family:Inter,sans-serif;color:#6c6c78;font-size:12px;margin-bottom:14px}
.ev{border-left:2px solid #2c2c36;padding:4px 0 8px 10px;color:#c9c9d3}
.ev.ok{border-color:var(--ok)}.ev.cmd{border-color:var(--amb);color:#b8f5c9}.ev.wait{border-color:var(--sky);color:#9fd2fb}
.ev i{font-style:normal;color:#6c6c78;margin-right:6px}
</style>
</head>
<body>
<aside class="list">
  <div class="search">Buscar</div>
  <div class="item on"><div class="ava">IA</div><div><b>Meu Claude</b><small>bot</small></div></div>
  <div class="item"><div class="ava g">IN</div><div><b>INEMA.CCODE</b><small>grupo</small></div></div>
</aside>
<main>
  <header><div class="ava">IA</div><div><b>Meu Claude</b><small id="st">bot</small></div></header>
  <div id="leg"></div>
  <div id="chat"></div>
  <form id="f"><input id="txt" autocomplete="off" placeholder="Mensagem"><button id="send" aria-label="Enviar">➤</button></form>
</main>
<aside class="ponte">
  <h2>PONTE (BOT)</h2>
  <p class="sub">O que acontece no servidor, ao vivo</p>
  <div id="log"></div>
</aside>
<script>
window.legenda=t=>{const l=document.getElementById("leg");l.textContent=t||"";l.classList.toggle("on",!!t)};
const chat=document.getElementById("chat"),log=document.getElementById("log"),st=document.getElementById("st");
const hora=()=>new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function msg(who,t){const d=document.createElement("div");d.className="m "+who;d.innerHTML=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>");const s=document.createElement("span");s.className="t";s.textContent=hora()+(who==="me"?" ✓✓":"");d.appendChild(s);chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function ev(cls,t){const d=document.createElement("div");d.className="ev "+cls;d.innerHTML="<i>"+new Date().toLocaleTimeString("pt-BR")+"</i>";d.appendChild(document.createTextNode(t.replace(/\/home\/[^\/\s]+/g,"~")));log.appendChild(d);log.parentElement.scrollTop=log.parentElement.scrollHeight}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();const i=document.getElementById("txt");const t=i.value.trim();if(!t)return;i.value="";
  msg("me",t);ev("","mensagem recebida de @nei");ev("ok","✓ usuário autorizado");ev("wait","→ claude -p (Claude Code, assinatura)");
  st.textContent="digitando…";st.className="typing";document.body.dataset.busy="1";
  try{
    const r=await fetch("/api/msg",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({usuario:"nei",texto:t})}).then(r=>r.json());
    (r.comandos||[]).forEach(c=>ev("cmd","$ "+c));
    ev("ok","✓ resposta em "+r.segundos+" s");msg("bot",r.resposta);
  }catch(err){ev("","falhou: "+err);msg("bot","Falhou: "+err)}
  st.textContent="bot";st.className="";document.body.dataset.busy="0";
});
</script>
</body>
</html>
